<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Agent Dashboard</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
</head>
<body>
<div class="shell">
  <nav class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-icon">🎙️</span>
      <div>
        <div class="brand-name">Voice Agent</div>
        <div class="brand-sub">dashboard</div>
      </div>
    </div>
    <div class="agent-status" id="agent-status">
      <span class="dot"></span><span class="status-text">checking…</span>
    </div>
    <!-- Live agent controls, in the sidebar so they're on screen whichever
         page is open. The mute state especially: losing track of it is the
         problem the button exists to solve. -->
    <button class="mute-btn" id="mute-btn" type="button" aria-pressed="false" disabled>
      <span class="mute-state">Microphone</span>
      <span class="mute-action">checking…</span>
    </button>
    <form class="send-form" id="send-form">
      <input type="text" id="send-text" placeholder="Type to the agent…"
             aria-label="Message to the agent" autocomplete="off" disabled>
      <button class="send-btn" id="send-btn" type="submit" disabled>Send</button>
      <div class="send-note" id="send-note" role="status"></div>
    </form>
    <div class="nav-links">
      <a href="#/overview" data-view="overview"><span class="nav-ico">◧</span>Overview</a>
      <a href="#/agents" data-view="agents"><span class="nav-ico">🎭</span>Agents</a>
      <a href="#/notes" data-view="notes"><span class="nav-ico">✎</span>Notes</a>
      <a href="#/config" data-view="config"><span class="nav-ico">⚙</span>Config</a>
      <a href="#/conversation" data-view="conversation"><span class="nav-ico">💬</span>Conversation</a>
      <a href="#/memory" data-view="memory"><span class="nav-ico">◔</span>Memory</a>
      <a href="#/knowledge" data-view="knowledge"><span class="nav-ico">📚</span>Knowledge</a>
      <a href="#/discord" data-view="discord"><span class="nav-ico">📈</span>Discord</a>
      <a href="#/trading" data-view="trading"><span class="nav-ico">💹</span>Trading</a>
      <a href="#/logs" data-view="logs"><span class="nav-ico">≣</span>Logs</a>
    </div>
    <div class="sidebar-foot">local · 127.0.0.1</div>
  </nav>
  <main class="main" id="main"></main>
</div>
<script src="/app.js"></script>
</body>
</html>
